<style>
:root{--bg:#1d1230;--pn:#2e1c4d;--gd:#f7c948;--mt:#3ddc97;--rs:#ff5d73;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:Nunito,system-ui,sans-serif;overflow:hidden;user-select:none;touch-action:none}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.scr.on{display:flex}
h1,h2,h3,.go,.tb{font-family:"Lilita One",Impact,sans-serif;font-weight:400;margin:0}
#ti{align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#5b2a86,var(--bg) 70%)}
#ti h1{font-size:min(14vw,110px);color:var(--gd);-webkit-text-stroke:3px #3b1a05;text-shadow:0 6px 0 #8a4b0a;letter-spacing:2px}
#ti p{animation:bl 1.4s infinite;margin:6px}@keyframes bl{50%{opacity:.3}}
#ti canvas{width:min(30vh,180px)}
.top{display:flex;gap:10px;padding:4px 12px;align-items:center;background:#150d24}
.top b{background:var(--pn);padding:6px 12px;border-radius:20px;font-size:15px}.top .sp{flex:1}
nav{display:flex;gap:6px;padding:4px 12px}
.tb{flex:1;padding:6px;border:0;border-radius:12px;background:var(--pn);color:#c9b8e8;font-size:18px}
.tb.on{background:var(--gd);color:#3b1a05}
#body{flex:1;overflow:auto;padding:8px 12px 16px;touch-action:pan-x pan-y}
.pl{display:flex;flex-direction:column;align-items:center;gap:4px}.pl canvas{width:120px}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;gap:6px;min-width:220px}
button{font:inherit;font-weight:900;color:#fff;cursor:pointer}
.o{padding:9px 14px;border-radius:10px;border:2px solid #5b3f8c;background:var(--pn)}.o.on{border-color:var(--mt);background:#1f4d44}
.go{font-size:34px;padding:12px 40px;border:0;border-radius:16px;background:var(--mt);color:#062b1f;box-shadow:0 5px 0 #1b8f63}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cd{background:var(--pn);border:3px solid;border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.cd canvas{width:76px}.cd.lk canvas{filter:brightness(.15)}.cd small{font-size:12px}
.cd button,.bx button{border:0;border-radius:9px;padding:7px 10px;background:#5b3f8c;font-size:13px;width:100%}
.bx{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:340px;margin:0 auto;text-align:center}
.bx .ch{font-size:70px}.bx button{background:var(--gd);color:#3b1a05;font-size:17px}
.rs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.it{background:var(--pn);border-radius:12px;padding:10px;min-width:92px;text-align:center;animation:pop .5s backwards}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}}
.it.cr{border:3px solid var(--gd);background:#4b2a1f}.it canvas{width:56px}
#gm{background:#000;align-items:center;justify-content:center}
#cv{width:100%;height:100%;object-fit:contain;touch-action:none}
#rot{position:absolute;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:30px}
@media(orientation:portrait){.scr{position:fixed;inset:auto;left:0;top:0;width:100vh;width:100dvh;height:100vw;height:100dvw;padding:0;transform:rotate(90deg) translateY(-100%);transform-origin:top left}#toast{transform:translate(-50%,-50%) rotate(90deg);top:50%}}
#ov{align-items:center;justify-content:center;background:rgba(10,5,20,.92);gap:10px;text-align:center}
#ov h2{font-size:48px;color:var(--gd)}
#ov .row b{background:var(--pn);padding:8px 14px;border-radius:12px}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:var(--rs);padding:10px 18px;border-radius:12px;font-weight:900;display:none;z-index:9}

.tb{font-size:19px;padding:8px 4px}.top b{font-size:19px}.o{font-size:18px;padding:10px 16px}.pl canvas{width:170px}.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.cd canvas{width:96px}.cd small{font-size:14px}.cd button{font-size:16px;padding:9px}.cd b{font-size:18px}h3{font-size:22px}.go{font-size:40px}
.pb{height:12px;background:#150d24;border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--mt)}
.bx .cimg{width:min(100%,380px);border-radius:16px}.bx button{font-size:20px;padding:12px}
#bo{align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1b3d9a,#0a1740 75%);text-align:center}
#bo .bos{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;cursor:pointer}
#bo .bos img{max-height:74%;max-width:90%;object-fit:contain;border-radius:18px}#bo .bos p{font-family:"Lilita One",Impact,sans-serif;font-size:28px;margin:8px}
#bn{position:absolute;right:12%;top:8%;width:84px;height:84px;border-radius:50%;background:var(--gd);color:#3b1a05;font:400 54px "Lilita One",Impact,sans-serif;display:flex;align-items:center;justify-content:center;border:4px solid #fff}
#fl{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,#5fd2ff,#1636d8);z-index:3}#fl.on{animation:fl .45s ease-out}@keyframes fl{from{opacity:var(--o,.6)}to{opacity:0}}
.sh{animation:sh .3s}@keyframes sh{20%{transform:rotate(-5deg) scale(1.05)}60%{transform:rotate(5deg) scale(1.05)}}
.ic{background:var(--pn);border-radius:18px;padding:14px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:320px;max-width:92%}.ic h2{font-size:30px}
.sr{display:flex;align-items:center;gap:10px;width:100%;font-size:17px}.sr span{width:76px;text-align:left}.sr .pb{flex:1}.sr b{width:44px;text-align:right}
#inf{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000c;z-index:5}#inf.on{display:flex}
.tb{font-size:15px;padding:8px 2px}.chip{background:var(--pn);padding:6px 14px;border-radius:20px;font-size:17px}
.path{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;touch-action:pan-x pan-y}.tier{min-width:118px;background:var(--pn);border:3px solid #5b3f8c;border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center}
.tier.ok{border-color:var(--mt)}.tier .rw{font-size:21px;font-weight:900}.tier button{border:0;border-radius:9px;padding:7px 10px;background:var(--mt);color:#062b1f;font-size:15px;width:100%}
#bo .cw{position:relative;height:72%}#bo .cw img{height:100%;width:auto;max-width:100%;max-height:none}
.tg{filter:hue-rotate(-165deg) saturate(1.5) brightness(1.1)}.td{filter:hue-rotate(-30deg) saturate(1.7)}.tc{filter:hue-rotate(70deg) saturate(1.4)}
.ico{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;background:#000a;display:flex;align-items:center;justify-content:center;font-size:56px}.ico canvas{width:84px}
.tb{font-size:14px}.inp{padding:10px 14px;border-radius:10px;border:2px solid #5b3f8c;background:#150d24;color:#fff;font:900 20px Nunito,sans-serif;text-align:center;user-select:text;-webkit-user-select:text;width:100%}
.lbr{display:flex;align-items:center;gap:10px;background:var(--pn);border-radius:12px;padding:4px 10px;margin:4px 0}.lbr.me{outline:2px solid var(--gd)}.lbr canvas{width:40px}.lbr b{flex:1;text-align:left}.lbr span{width:24px}
#sr,#ld,#ns{align-items:center;justify-content:center;gap:12px;text-align:center;background:radial-gradient(circle at 50% 40%,#1b3d9a,#0a1740 75%)}
.spin{width:60px;height:60px;border:6px solid #5b3f8c;border-top-color:var(--gd);border-radius:50%;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.lb{width:min(70%,360px);height:14px;border-radius:7px;background:#150d24;overflow:hidden}.lb i{display:block;height:100%;width:0;background:var(--mt);animation:lb 1.6s linear forwards}@keyframes lb{to{width:100%}}
.big{height:100%;display:flex;align-items:center;justify-content:center;font-size:min(34vw,150px);filter:drop-shadow(0 0 30px #ffd23f)}.big canvas{height:100%;width:auto;max-width:100%}.tb{font-size:13px}#of2{align-items:center;justify-content:center;gap:12px;text-align:center;background:#0a1740}
#iv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;background:#000c;z-index:20}#iv.on{display:flex}
